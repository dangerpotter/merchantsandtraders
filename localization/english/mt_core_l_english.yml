 mt_production_modest_desc:0 "This region maintains steady production of trade goods. Regular surpluses allow for profitable export to neighboring territories."

 mt_production_rich:0 "Rich Production"
 mt_production_rich_desc:0 "This region produces abundant trade goods. Substantial surpluses flow into trade networks, enriching local merchants and lords alike."

 mt_production_abundant:0 "Abundant Production"
 mt_production_abundant_desc:0 "This region overflows with trade goods. Exceptional production creates enormous wealth through extensive export trade."

