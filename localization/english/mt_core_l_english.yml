 mt_merchant_fleet_charter_power_desc:0 "A chartered fleet of ships extends commercial reach across seas and coastlines."

 mt_trade_monopoly_power:0 "Trade Monopoly"
 mt_trade_monopoly_power_desc:0 "Monopoly control over specific goods eliminates competition and maximizes profits."

 mt_currency_minting_power:0 "Currency Minting Rights"
 mt_currency_minting_power_desc:0 "The right to mint currency is a mark of sovereign authority, even for a merchant."

 mt_employed_merchant_agents:0 "Employed Merchant Agents"
 mt_employed_merchant_agents_desc:0 "Hired agents conduct business in distant locations, extending commercial reach."

