 ## BUILDING CHAINS

 mt_trade_infrastructure:0 "Trade Infrastructure"
 mt_trade_infrastructure_desc:0 "Commercial buildings that facilitate trade and generate income through market activity."

 mt_trade_infrastructure_tribal:0 "Tribal Trade Infrastructure"
 mt_trade_infrastructure_tribal_desc:0 "Basic trading facilities suitable for tribal societies, enabling commerce without permanent urban structures."

 ## FEUDAL/CLAN BUILDINGS

 mt_market_01:0 "Market"
 mt_market_01_desc:0 "A designated marketplace where merchants gather to sell their wares. Stalls and temporary structures provide basic commercial facilities, attracting local traders and occasional traveling merchants."

 mt_trade_quarter_02:0 "Trade Quarter"
 mt_trade_quarter_02_desc:0 "A dedicated district for commerce, with permanent shops, warehouses, and merchant houses. Artisans, traders, and money changers conduct business in an organized commercial environment."

 mt_merchant_district_03:0 "Merchant District"
 mt_merchant_district_03_desc:0 "An extensive commercial zone dominated by wealthy merchant establishments, large warehouses, counting houses, and guild halls. Major trading companies maintain permanent headquarters here."

 mt_grand_bazaar_04:0 "Grand Bazaar"
 mt_grand_bazaar_04_desc:0 "A magnificent commercial complex rivaling the greatest markets of the known world. Covered galleries, elaborate fountains, and grand merchant palaces make this bazaar a wonder of commerce, drawing traders from distant continents."

 ## TRIBAL BUILDINGS

 mt_tribal_market_01:0 "Tribal Market"
 mt_tribal_market_01_desc:0 "A gathering place for tribal traders, where goods are exchanged and deals are made. Simple but effective, this market serves the needs of a mobile society."

 mt_tribal_trade_post_02:0 "Tribal Trade Post"
 mt_tribal_trade_post_02_desc:0 "A semi-permanent trading post where tribal merchants store goods and conduct business with outsiders. This facility bridges the gap between nomadic and settled commerce."

