 ############################################
 # MERCHANTS AND TRADERS MOD - CORE LOCALIZATION
 # English localization for all core systems
 ############################################

 #####################
 # MERCHANT TRAITS
 #####################

 # Wandering Merchant (Tier 1)
 wandering_merchant:0 "Wandering Merchant"
 wandering_merchant_desc:0 "This character has taken to the merchant's life, traveling between settlements to buy and sell goods. Though their operations are modest, they have learned the fundamentals of trade and commerce."
 wandering_merchant_effects:0 "This character gains increased income from trade activities and can establish basic trade routes."

 # Trade Post Owner (Tier 2)
 trade_post_owner:0 "Trade Post Owner"
 trade_post_owner_desc:0 "This merchant has established permanent trading posts in key locations, allowing them to conduct business on a larger scale. They maintain warehouses, employ factors, and have built relationships with local authorities."
 trade_post_owner_effects:0 "This character operates established trade posts and can manage multiple trade routes simultaneously."

 # Trading Company Head (Tier 3)
 trading_company_head:0 "Trading Company Head"
 trading_company_head_desc:0 "At the helm of a significant trading enterprise, this merchant commands considerable resources. Their company operates across multiple regions, employing numerous agents and controlling valuable trade routes."
 trading_company_head_effects:0 "This character leads a major trading company with extensive operations and significant economic influence."

 # Merchant Prince (Tier 4)
 merchant_prince:0 "Merchant Prince"
 merchant_prince_desc:0 "Few merchants reach such heights of wealth and influence. This legendary trader commands a commercial empire that rivals the treasuries of kingdoms. Their word can make or break markets, and rulers seek their counsel on matters of trade and finance."
 merchant_prince_effects:0 "This character wields immense economic power and influence, comparable to great nobles of the realm."

 #####################
 # TRADE GOODS
 #####################

 ## LUXURY GOODS (9 items)

 # Silk
 mt_trade_good_silk:0 "Fine Silk"
 mt_trade_good_silk_desc:0 "Luxurious fabric woven from threads produced by silkworms, primarily imported from the distant East. Prized by nobility for its smooth texture and lustrous appearance, silk garments are symbols of wealth and refinement. A single bolt of fine silk can cost more than a common farmer earns in a year."

 # Spices
 mt_trade_good_spices:0 "Exotic Spices"
 mt_trade_good_spices_desc:0 "Rare seasonings from distant tropical lands—pepper, cinnamon, cloves, and nutmeg. These precious commodities preserve food, enhance flavor, and demonstrate the wealth of those who can afford them. Worth their weight in silver, spices have launched expeditions and founded fortunes."

 # Jade
 mt_trade_good_jade:0 "Precious Jade"
 mt_trade_good_jade_desc:0 "Carved gemstone treasured in the Far East for its beauty and spiritual significance. Master artisans craft jade into jewelry, ornaments, and religious artifacts. The finest jade pieces, translucent and richly colored, command extraordinary prices among collectors and rulers."

 # Amber
 mt_trade_good_amber:0 "Baltic Amber"
 mt_trade_good_amber_desc:0 "Fossilized tree resin from the shores of the northern seas, prized for its golden warmth and the ancient insects sometimes preserved within. Fashioned into beads, amulets, and decorative pieces, amber has been treasured since ancient times and is believed by some to hold protective properties."

 # Pearls
 mt_trade_good_pearls:0 "Lustrous Pearls"
 mt_trade_good_pearls_desc:0 "Gleaming gems harvested from oysters in dangerous waters. Divers risk their lives to retrieve these treasures from the depths. Perfect pearls adorn crowns, embellish religious vestments, and grace the necks of noble ladies. The rarest specimens can bankroll entire military campaigns."

 # Ivory
 mt_trade_good_ivory:0 "Elephant Ivory"
 mt_trade_good_ivory_desc:0 "White gold from distant lands, carved from the tusks of mighty elephants. Skilled artisans transform ivory into intricate artwork, chess pieces, holy relics, and decorative inlays. The difficulty of obtaining and transporting ivory makes it a luxury reserved for the wealthy and powerful."

 # Purple Dye
 mt_trade_good_purple_dye:0 "Tyrian Purple"
 mt_trade_good_purple_dye_desc:0 "The royal color, extracted laboriously from thousands of sea snails. This deep, rich purple dye has been the exclusive mark of emperors and kings since ancient times. So expensive to produce that purple-dyed cloth literally costs more than gold, ounce for ounce."

 # Incense
 mt_trade_good_incense:0 "Sacred Incense"
 mt_trade_good_incense_desc:0 "Fragrant resins—frankincense, myrrh, and others—harvested from trees in Arabia and the Horn of Africa. Burned in churches, mosques, and temples, incense carries prayers to the heavens. Religious authorities purchase vast quantities, making the incense trade both holy and highly profitable."

 # Saffron
 mt_trade_good_saffron:0 "Golden Saffron"
 mt_trade_good_saffron_desc:0 "The world's most precious spice, harvested from crocus flowers with painstaking care. It takes thousands of flowers to produce a single pound of saffron threads. Used to flavor and color the finest dishes, saffron also serves as medicine and dye, its golden hue symbolizing wealth itself."

 ## COMMON GOODS (9 items)

 # Grain
 mt_trade_good_grain:0 "Grain"
 mt_trade_good_grain_desc:0 "The staff of life—wheat, barley, rye, and oats—essential for feeding the populace. While individual shipments are worth little, the grain trade moves vast quantities and generates steady profits. Wise merchants know that controlling grain supplies grants power over cities and armies alike."

 # Wine
 mt_trade_good_wine:0 "Wine"
 mt_trade_good_wine_desc:0 "Fermented grape juice, ranging from rough table wine to exquisite vintages. Essential for religious ceremonies and noble feasts alike, wine flows freely in every realm. Regional varieties develop loyal followings, and the finest wines from celebrated vineyards command premium prices."

 # Iron
 mt_trade_good_iron:0 "Iron"
 mt_trade_good_iron_desc:0 "The metal of civilization—tools, weapons, armor, nails, horseshoes, and countless other necessities are forged from iron. Mining regions rich in iron ore prosper, and skilled smiths turn this base metal into items both humble and magnificent. War and peace alike depend on steady supplies of iron."

 # Wool
 mt_trade_good_wool:0 "Wool"
 mt_trade_good_wool_desc:0 "Shorn from sheep and woven into cloth, wool keeps people warm and clothed throughout the realm. The wool trade sustains entire regions—shepherds raise the flocks, fullers process the fleece, weavers create the fabric, and merchants transport it to distant markets. Quality wool from prized breeds fetches the best prices."

 # Furs
 mt_trade_good_furs:0 "Furs"
 mt_trade_good_furs_desc:0 "Pelts from fox, beaver, marten, and ermine, trapped in the northern forests. Fur garments provide essential warmth in winter and display one's status—the finest furs grace the shoulders of nobles and royalty. Trappers brave harsh wilderness to supply the endless demand."

 # Salt
 mt_trade_good_salt:0 "Salt"
 mt_trade_good_salt_desc:0 "White gold, essential for preserving meat and fish through the winter. Before ice houses, salt meant survival. Mined from ancient deposits or evaporated from seawater, salt generates steady profits for those who control its sources. Entire trade routes exist solely to transport this vital commodity."

 # Timber
 mt_trade_good_timber:0 "Timber"
 mt_trade_good_timber_desc:0 "Wood from mighty forests—oak for ships and buildings, pine for construction, rare woods for fine furniture. Cities constantly consume timber for construction, heating, and industry. Regions with extensive forests ship vast quantities downriver to treeless lands, where wood commands high prices."

 # Horses
 mt_trade_good_horses:0 "Horses"
 mt_trade_good_horses_desc:0 "Magnificent beasts bred for war, travel, and labor. From humble plow horses to destriers worth a knight's ransom, the horse trade supplies the mobility of medieval society. Master breeders cultivate bloodlines prized for strength, speed, and temperament, while merchants transport these valuable animals across continents."

 # Cattle
 mt_trade_good_cattle:0 "Cattle"
 mt_trade_good_cattle_desc:0 "Livestock providing meat, milk, leather, and labor. Cattle represent wealth itself in many regions—a herd is a fortune on the hoof. Merchants drive cattle along ancient routes to markets and slaughterhouses, and the sale of beef, leather goods, and dairy products sustains countless livelihoods."

 ## REGIONAL SPECIALTIES (7 items)

 # Tea
 mt_trade_good_tea:0 "Tea"
 mt_trade_good_tea_desc:0 "Dried leaves from the tea plant, primarily cultivated in the Far East. Brewed into a beverage both stimulating and refined, tea is central to the culture of distant lands. As knowledge of tea spreads westward, sophisticated merchants establish lucrative trade in this exotic commodity."

 # Porcelain
 mt_trade_good_porcelain:0 "Fine Porcelain"
 mt_trade_good_porcelain_desc:0 "Delicate ceramic ware from distant Eastern workshops, created through secret techniques unknown in the West. White as snow, translucent as glass, and decorated with exquisite artistry, porcelain vessels are prized by collectors. The fragility that makes transport so challenging also enhances their value."

 # Dates
 mt_trade_good_dates:0 "Dates"
 mt_trade_good_dates_desc:0 "Sweet fruit from palm trees cultivated in desert oases. Highly nutritious and naturally preserved by the arid climate, dates sustain desert travelers and provide natural sweetness to those who can afford them. Caravans carry these concentrated sources of energy throughout the medieval world."

 # Olive Oil
 mt_trade_good_olive_oil:0 "Olive Oil"
 mt_trade_good_olive_oil_desc:0 "Pressed from olives grown in Mediterranean groves, this golden liquid serves countless purposes—cooking, lighting, medicine, and religious anointing. The finest olive oils, first-pressed and carefully stored, are prized for their flavor and purity. Amphorae of quality oil travel far from their sunlit origins."

 # Honey
 mt_trade_good_honey:0 "Honey"
 mt_trade_good_honey_desc:0 "Nature's sweetness, gathered by brave beekeepers from hives of industrious bees. Before sugar, honey was the primary sweetener, used in cooking, brewing mead, and medicine. Quality honey from specific flowers—heather, acacia, wildflower—develops devoted customers willing to pay premium prices."

 # Linen
 mt_trade_good_linen:0 "Linen"
 mt_trade_good_linen_desc:0 "Fabric woven from flax fibers, prized for its coolness and smoothness. Linen serves for clothing in warm weather, bedding, and especially undergarments for the wealthy. The finest linen, bleached white and woven thin, demonstrates quality craftsmanship and commands respect in markets throughout the known world."

 # Glass
 mt_trade_good_glass:0 "Venetian Glass"
 mt_trade_good_glass_desc:0 "Transparent and colored glass crafted by master artisans, especially the renowned glassmakers of Venice. Window panes, drinking vessels, beads, and decorative objects showcase the glassmaker's art. The secrets of creating the finest glass are jealously guarded, making authentic pieces highly valuable."

