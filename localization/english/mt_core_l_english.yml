 mt_extensive_trade_network_desc:0 "A vast network of contacts, routes, and posts spans multiple regions and generates substantial wealth."

 mt_strategic_trade_control:0 "Strategic Trade Control"
 mt_strategic_trade_control_desc:0 "Control of key trade routes and markets provides enormous economic leverage."

 mt_legendary_merchant_reputation:0 "Legendary Reputation"
 mt_legendary_merchant_reputation_desc:0 "Stories of this merchant's success and integrity are told throughout the commercial world."

 mt_reliable_merchant:0 "Reliable Merchant"
 mt_reliable_merchant_desc:0 "Consistent honesty and delivered promises have built a reputation for reliability."

 mt_innovative_merchant:0 "Innovative Merchant"
