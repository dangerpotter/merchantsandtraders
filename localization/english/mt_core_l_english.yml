 mt_first_trade_post_established_desc:0 "Establishing the first trade post marks the transition from wandering merchant to established trader—a proud milestone."

 mt_first_agent_hired:0 "First Agent Hired"
 mt_first_agent_hired_desc:0 "Hiring the first agent represents growth beyond individual capacity—the business is becoming an enterprise."

