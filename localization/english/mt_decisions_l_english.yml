l_english:

 ####################################
 # TRADE TAXATION DECISIONS
 ####################################

 establish_trade_taxation_decision:0 "Establish Trade Taxation"
 establish_trade_taxation_decision_desc:0 "As a ruler, you can impose taxes on all merchants operating trade routes through your lands. This will bring immediate gold income, but merchants will resent the burden and trade route health will suffer."
 establish_trade_taxation_decision_tooltip:0 "Tax all merchants passing through your realm"
 establish_trade_taxation_decision_effect_tooltip:0 "All trade routes through your lands will pay 10% tax to you, generating monthly gold income. However, route health decreases by 20% and merchants gain -15 opinion of you."
 establish_trade_taxation_decision_confirm:0 "Begin Taxation"

 revoke_trade_taxation_decision:0 "Revoke Trade Taxation"
 revoke_trade_taxation_decision_desc:0 "End the taxation of merchants operating in your realm. Trade routes will become healthier and merchants will view you more favorably."
 revoke_trade_taxation_decision_tooltip:0 "Stop taxing merchants in your realm"
 revoke_trade_taxation_decision_effect_tooltip:0 "Remove trade taxation policy. Merchants will appreciate this change and trade route health will recover."
 revoke_trade_taxation_decision_confirm:0 "End Taxation"

 mt_trade_taxation_policy:0 "Trade Taxation Policy"
 mt_trade_taxation_policy_desc:0 "This ruler taxes all merchants operating trade routes through their lands."

 ####################################
 # MERCHANT PROTECTION DECISIONS
 ####################################

 protect_merchant_caravans_decision:0 "Protect Merchant Caravans"
 protect_merchant_caravans_decision_desc:0 "Invest in protecting merchant caravans from bandits and raiders. This costs gold to maintain guards and patrols, but makes your realm attractive for trade and improves route health significantly."
 protect_merchant_caravans_decision_tooltip:0 "Spend gold to protect merchants in your realm"
 protect_merchant_caravans_decision_effect_tooltip:0 "Costs 1 gold per month per active route in your realm. Routes through your lands gain +20% health and merchants gain +20 opinion of you. This attracts more merchants to your lands."
 protect_merchant_caravans_decision_confirm:0 "Protect Merchants"

 revoke_merchant_protection_decision:0 "Revoke Merchant Protection"
 revoke_merchant_protection_decision_desc:0 "End the costly protection of merchant caravans. This will save gold but merchants will be disappointed and trade routes will become more dangerous."
 revoke_merchant_protection_decision_tooltip:0 "Stop protecting merchants in your realm"
 revoke_merchant_protection_decision_effect_tooltip:0 "Remove merchant protection policy. Save gold but lose merchant goodwill and trade route health bonuses."
 revoke_merchant_protection_decision_confirm:0 "End Protection"

 mt_merchant_protection_policy:0 "Merchant Protection Policy"
 mt_merchant_protection_policy_desc:0 "This ruler actively protects merchant caravans from bandits and raiders."

 ####################################
 # TRADE MONOPOLY DECISIONS
 ####################################

 grant_trade_monopoly_decision:0 "Grant Trade Monopoly"
 grant_trade_monopoly_decision_desc:0 "As a powerful monarch, you can grant exclusive trade rights for specific goods to a chosen merchant. This creates a monopoly that will make the chosen merchant extremely wealthy and loyal, but all other merchants will be furious at being excluded from profitable markets."
 grant_trade_monopoly_decision_tooltip:0 "Grant exclusive trade rights to a specific merchant"
 grant_trade_monopoly_decision_effect_tooltip:0 "Costs 100 prestige. The chosen merchant gains exclusive rights to trade specific goods in your kingdom, receiving massive profit bonuses. All other merchants gain -30 opinion of you, while the chosen merchant gains +50 opinion. Creates significant political conflict."
 grant_trade_monopoly_decision_confirm:0 "Grant Monopoly"

 revoke_trade_monopoly_decision:0 "Revoke Trade Monopoly"
 revoke_trade_monopoly_decision_desc:0 "End the trade monopoly you granted. The monopoly holder will be angry, but other merchants will be pleased that fair competition is restored."
 revoke_trade_monopoly_decision_tooltip:0 "End the trade monopoly"
 revoke_trade_monopoly_decision_effect_tooltip:0 "Remove the trade monopoly. The monopoly holder will be angry (-30 opinion), but other merchants will appreciate the return to fair competition."
 revoke_trade_monopoly_decision_confirm:0 "Revoke Monopoly"

 mt_trade_monopoly_granted:0 "Trade Monopoly Granted"
 mt_trade_monopoly_granted_desc:0 "This ruler has granted a trade monopoly to a specific merchant."

 mt_trade_monopoly_holder:0 "Trade Monopoly Holder"
 mt_trade_monopoly_holder_desc:0 "This merchant has been granted exclusive trade rights by their liege."

 ####################################
 # FOREIGN MERCHANTS DECISIONS
 ####################################

 invite_foreign_merchants_decision:0 "Invite Foreign Merchants"
 invite_foreign_merchants_decision_desc:0 "Invest gold to attract foreign merchants to establish trade posts in your realm. This brings new goods, cultural exchange, and development growth, making your realm a cosmopolitan trade center."
 invite_foreign_merchants_decision_tooltip:0 "Attract foreign merchants to your realm"
 invite_foreign_merchants_decision_effect_tooltip:0 "Costs 50 gold. Random foreign merchants establish trade posts in your realm, providing +1.5 monthly gold from trade activity and +development growth. Your realm becomes more prosperous and cosmopolitan."
 invite_foreign_merchants_decision_confirm:0 "Invite Merchants"

 mt_foreign_merchants_active:0 "Foreign Merchants Active"
 mt_foreign_merchants_active_desc:0 "Foreign merchants have established trade posts in this realm."

 ####################################
 # BAN MERCHANT ACTIVITY DECISIONS
 ####################################

 ban_merchant_activity_decision:0 "Ban Merchant Activity"
 ban_merchant_activity_decision_desc:0 "Forbid all merchant activity in your realm. This is a drastic measure that will tank your economy and infuriate merchants, but prevents economic exploitation and foreign influence. Only use this if you want to completely opt out of the trade mechanics."
 ban_merchant_activity_decision_tooltip:0 "Ban all merchant activity in your realm"
 ban_merchant_activity_decision_effect_tooltip:0 "All trade posts close and merchant activity ceases. You lose significant monthly gold and development growth. All merchants gain -50 opinion of you. This is essentially opting out of the trade system."
 ban_merchant_activity_decision_confirm:0 "Ban Merchants"
 ban_merchant_activity_decision_warning:0 "This decision will severely damage your economy and close all trade posts. Only choose this if you truly want to exclude merchant activity from your realm."

 revoke_merchant_ban_decision:0 "Revoke Merchant Ban"
 revoke_merchant_ban_decision_desc:0 "Reverse your decision to ban merchant activity. This costs prestige as you admit the policy was too extreme, but allows trade to resume in your realm."
 revoke_merchant_ban_decision_tooltip:0 "Allow merchant activity again"
 revoke_merchant_ban_decision_effect_tooltip:0 "Costs 50 prestige. Merchant activity is permitted again, though merchants will remain resentful for some time. Trade routes can be re-established."
 revoke_merchant_ban_decision_confirm:0 "Allow Merchants"

 mt_merchant_activity_banned:0 "Merchant Activity Banned"
 mt_merchant_activity_banned_desc:0 "This ruler has banned all merchant activity in their realm."

 ####################################
 # MERCHANT OPINION MODIFIERS
 ####################################

 mt_merchant_approval:0 "Merchant Approval"
 mt_merchant_approval_desc:0 "This ruler has earned the approval of the merchant class through favorable policies."

 mt_merchant_resentment:0 "Merchant Resentment"
 mt_merchant_resentment_desc:0 "Merchants resent this ruler's policies toward trade."

 mt_merchant_fury:0 "Merchant Fury"
 mt_merchant_fury_desc:0 "Merchants are furious with this ruler's extreme restrictions on trade."

 ####################################
 # TOOLTIPS AND NOTIFICATIONS
 ####################################

 mt_trade_policy_decisions:0 "Trade Policy Decisions"
 mt_trade_policy_decisions_desc:0 "Major decisions that affect how your realm interacts with merchants and trade routes."

 mt_has_merchants_operating:0 "Merchants are operating in your realm"
 mt_no_merchants_operating:0 "No merchants currently operate in your realm"

 mt_has_coastal_trade_city:0 "You have a coastal or trade city"
 mt_no_coastal_trade_city:0 "You need a coastal or trade city"

 mt_not_isolationist:0 "You are not isolationist"
 mt_is_isolationist:0 "Your culture values isolation"

 ####################################
 # CORE MERCHANT DECISIONS
 ####################################

 #####################
 # ESTABLISH TRADE POST DECISION
 #####################

 mt_establish_trade_post_decision_title:0 "Establish Trade Post"
 mt_establish_trade_post_decision_desc:0 "A permanent trade post in this county will serve as a base for your commercial operations. Warehouses, factor's offices, and local contacts will allow you to conduct business more efficiently in this region."
 mt_establish_trade_post_decision_tooltip:0 "Create a permanent trading presence in a strategic county."

 # Requirement tooltips
 mt_establish_trade_post_not_owner_tt:0 "You cannot establish a trade post in your own capital county."
 mt_establish_trade_post_valid_location_tt:0 "The local ruler must have at least neutral opinion of you, or you must be allied."
 mt_establish_trade_post_no_existing_tt:0 "You do not already have a trade post in this county."
 mt_establish_trade_post_capacity_tt:0 "You have capacity for additional trade posts."

 # Success tooltip
 mt_establish_trade_post_success_tt:0 "A new trade post has been established! This location will serve as a hub for your commercial activities."

 #####################
 # SCOUT TRADE OPPORTUNITY DECISION
 #####################

 mt_scout_trade_opportunity_decision_title:0 "Scout Trade Opportunities"
 mt_scout_trade_opportunity_decision_desc:0 "Send scouts to survey the surrounding regions, identifying profitable trade routes, sources of valuable goods, and markets with strong demand. Knowledge is the foundation of successful commerce."
 mt_scout_trade_opportunity_decision_tooltip:0 "Discover profitable trade routes and valuable goods in nearby regions."

 # Requirement tooltips
 mt_scout_opportunity_cooldown_tt:0 "Your scouts need time to gather reliable information."

 # Success tooltips
 mt_scout_opportunity_reveal_tt:0 "Your scouts will reveal promising trade opportunities in nearby regions."
 mt_scout_silk_opportunity_tt:0 "Your scouts report sources of [mt_trade_good_silk|E] in the region—a lucrative luxury good!"
 mt_scout_spices_opportunity_tt:0 "Merchants speak of [mt_trade_good_spices|E] available in distant markets—highly profitable if you can secure a route!"
 mt_scout_jade_opportunity_tt:0 "Rumors tell of [mt_trade_good_jade|E] from far eastern lands—a treasure for those who can arrange its transport!"
 mt_scout_wine_opportunity_tt:0 "Local vineyards produce [mt_trade_good_wine|E] that could fetch good prices in regions without viticulture."
 mt_scout_salt_opportunity_tt:0 "Salt mines in the area produce [mt_trade_good_salt|E]—essential goods that always find buyers."
 mt_scout_wool_opportunity_tt:0 "Shepherds produce quality [mt_trade_good_wool|E] that weavers in distant cities would pay well for."
 mt_scout_destination_capital_tt:0 "The capital city offers a wealthy market with strong demand for luxury goods and staples alike."
 mt_scout_destination_trade_hub_tt:0 "A major trade hub provides excellent opportunities—many merchants, high prices, and connections to distant markets."
 mt_scout_destination_wealthy_tt:0 "A prosperous county with high development would pay premium prices for quality goods."
 mt_scout_destination_coastal_tt:0 "Coastal cities offer access to maritime trade routes and exotic goods from across the seas."

 #####################
 # HIRE MERCHANT AGENT DECISION
 #####################

 mt_hire_merchant_agent_decision_title:0 "Hire Merchant Agent"
 mt_hire_merchant_agent_decision_desc:0 "Your business has grown beyond what one person can manage directly. Hiring a skilled agent to handle trade routes on your behalf will free you to pursue larger opportunities while maintaining existing operations."
 mt_hire_merchant_agent_decision_tooltip:0 "Employ a trusted agent to manage trade routes and expand your operations."

 # Requirement tooltips
 mt_hire_agent_need_trade_post_tt:0 "You must have at least one established trade post to employ an agent."
 mt_hire_agent_capacity_tt:0 "You have capacity to hire additional agents."
 mt_hire_agent_afford_salary_tt:0 "Your monthly income is sufficient to pay an agent's salary."

 # Success tooltip
 mt_hire_agent_success_tt:0 "A capable agent has joined your service and will help manage your growing commercial enterprise."

 #####################
 # EXPAND TRADING COMPANY DECISION
 #####################

 mt_expand_trading_company_decision_title:0 "Expand Trading Company"
 mt_expand_trading_company_decision_desc:0 "Your trading company has achieved considerable success. A major expansion—new warehouses, additional agents, more trade routes—will transform your enterprise into one of the great commercial powers of the age."
 mt_expand_trading_company_decision_tooltip:0 "Significantly expand your trading company's capabilities and reach."

 # Requirement tooltips
 mt_expand_company_need_routes_tt:0 "You must operate at least 5 active trade routes to justify expansion."
 mt_expand_company_need_wealth_tt:0 "Expansion requires significant capital: at least 1,000 gold."
 mt_expand_company_need_reputation_tt:0 "Your reputation must be well-established (at least 50 reputation) to attract the resources needed for expansion."
 mt_expand_company_cooldown_tt:0 "Major expansions require years to consolidate—you must wait before expanding again."

 # Success tooltip
 mt_expand_company_success_tt:0 "Your trading company has expanded significantly! New capabilities will drive even greater profits."

 #####################
 # PETITION MERCHANT REPUBLIC STATUS DECISION
 #####################

 mt_petition_merchant_republic_status_decision_title:0 "Petition for Merchant Republic Status"
 mt_petition_merchant_republic_status_decision_desc:0 "You have achieved what few merchants ever dream of—vast wealth, extensive trade networks, and legendary reputation. Now you seek the ultimate recognition: formal status as a merchant republic, with all the rights and privileges that entails. This is the crowning achievement of a merchant's life."
 mt_petition_merchant_republic_status_decision_tooltip:0 "Achieve the pinnacle of mercantile success—recognition as a merchant republic."

 # Requirement tooltips
 mt_petition_republic_need_holding_tt:0 "You must control at least one county to establish a merchant republic."
 mt_petition_republic_need_routes_tt:0 "Your trade network must span at least 10 active trade routes."
 mt_petition_republic_need_reputation_tt:0 "Your reputation must be legendary—known throughout the commercial world."
 mt_petition_republic_need_prestige_tt:0 "You must have accumulated at least 1,000 prestige to command respect from other rulers."
 mt_petition_republic_need_approval_tt:0 "If you have a liege, they must approve (opinion at least +50). Independent rulers may proceed freely."
 mt_petition_republic_need_infrastructure_tt:0 "You must control at least 5 trade posts across multiple regions."
 mt_petition_republic_need_guilds_tt:0 "You must have established merchant guilds to regulate trade and maintain standards."

 # Success tooltip
 mt_petition_republic_success_tt:0 "You have achieved merchant republic status! Your commercial empire is now recognized as a power in its own right, with special privileges and unprecedented influence."

