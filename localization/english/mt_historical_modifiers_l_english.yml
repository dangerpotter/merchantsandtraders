 ####################################
 # BLACK DEATH MODIFIERS
 ####################################

 mt_plague_profiteer:0 "Plague Profiteer"
 mt_plague_profiteer_desc:0 "This character made enormous profits trading during the plague, which some view as callous opportunism."

 mt_plague_survivor:0 "Plague Survivor"
 mt_plague_survivor_desc:0 "This character survived the Black Death and is viewed with awe and respect. They may have immunity to further outbreaks."

 mt_plague_quarantine:0 "Under Quarantine"
 mt_plague_quarantine_desc:0 "This character's trade operations are restricted by plague quarantine measures."

 mt_essential_goods_trader:0 "Essential Goods Trader"
 mt_essential_goods_trader_desc:0 "This character traded in essential goods during the plague, helping people survive while also profiting."

 mt_premium_wages_paid:0 "Fair Employer"
 mt_premium_wages_paid_desc:0 "This character paid premium wages after the plague, earning worker loyalty but reducing profits."

 mt_labor_crisis:0 "Labor Crisis"
 mt_labor_crisis_desc:0 "This character faces a severe labor shortage with workers demanding higher wages."

 mt_innovative_methods:0 "Innovative Methods"
 mt_innovative_methods_desc:0 "This character has adopted labor-saving innovations to cope with worker shortages."

 mt_post_plague_expansion:0 "Post-Plague Expansion"
 mt_post_plague_expansion_desc:0 "This character is expanding operations in the economic recovery following the plague."

 mt_quarantine_subject:0 "Quarantine Subject"
 mt_quarantine_subject_desc:0 "This character is subject to quarantine measures that disrupt their trade."

 mt_post_plague_recovery:0 "Post-Plague Recovery"
 mt_post_plague_recovery_desc:0 "This character is rebuilding trade networks as markets reopen after the plague."

 mt_economic_visionary:0 "Economic Visionary"
 mt_economic_visionary_desc:0 "This character understands the transformed post-plague economy and adapts brilliantly to new trade patterns."

